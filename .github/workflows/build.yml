name: Build BarFold

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Swift toolchain
        run: swift --version

      - name: Read version
        id: version
        shell: zsh {0}
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw Support/Info.plist)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $VERSION" >&2
            exit 1
          fi

      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build and package
        run: ./scripts/build-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: BarFold-${{ steps.version.outputs.version }}-macOS
          path: outputs/BarFold-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish development GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARCHIVE="outputs/BarFold-$VERSION.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" \
              --title "BarFold $VERSION" \
              --generate-notes
          fi


  signed-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Read version
        id: version
        shell: zsh {0}
        run: |
          VERSION="$(plutil -extract CFBundleShortVersionString raw Support/Info.plist)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_IDENTITY"; test -n "$TEAM_ID"; test -n "$APPLE_ID"
          test -n "$APP_SPECIFIC_PASSWORD"; test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"; test -n "$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > developer-id.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security import developer-id.p12 -k build.keychain-db -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s build.keychain-db login.keychain-db
          security default-keychain -s build.keychain-db
          security find-identity -v -p codesigning build.keychain-db
      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build signed app
        env:
          BARFOLD_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: ./scripts/build-release.sh
      - name: Store Apple notarization credentials
        run: |
          xcrun notarytool store-credentials BarFold-notary \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD" --keychain build.keychain-db
      - name: Submit for notarization
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcrun notarytool submit "outputs/BarFold-$VERSION.zip" \
            --keychain-profile BarFold-notary --keychain build.keychain-db --wait
      - name: Staple and validate notarization
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf notarize-work dist-notarized
          mkdir -p dist-notarized
          ditto -x -k "outputs/BarFold-$VERSION.zip" notarize-work
          xcrun stapler staple notarize-work/BarFold.app
          xcrun stapler validate notarize-work/BarFold.app
          codesign --verify --deep --strict --verbose=2 notarize-work/BarFold.app
          spctl --assess --type execute --verbose=2 notarize-work/BarFold.app
          ditto -c -k --sequesterRsrc --keepParent notarize-work/BarFold.app "dist-notarized/BarFold-$VERSION-notarized.zip"
          shasum -a 256 dist-notarized/*.zip > dist-notarized/SHA256SUMS.txt
      - name: Publish notarized GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-notarized/* \
            --verify-tag --title "BarFold $VERSION" --generate-notes
      - name: Remove temporary key material
        if: always()
        run: |
          security delete-keychain build.keychain-db || true
          rm -f developer-id.p12
